spring:
  application:
    name: picture-browser
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: <>
    username: <>
    password: <>
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # 开发环境使用，自动创建/更新数据表
    show-sql: true # 打印 SQL 语句，方便调试

  data:
    redis:
      host: <>
      port: 6379
      password: <>
      database: 0
      # 超时配置（Spring Boot 3.x 统一使用Duration格式，也兼容毫秒数值）
      timeout: PT10S           # 连接超时时间（PT10S = 10秒，兼容写法：10000）
      connect-timeout: PT5S    # 连接建立超时（3.x新增，独立于timeout)

      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 16               # 最大活跃连接数（生产环境建议16，默认8）
          max-idle: 8                  # 最大空闲连接数（默认8）
          min-idle: 2                  # 最小空闲连接数（3.x推荐设置≥2，默认0）
          max-wait: PT2S               # 最大等待时间（PT2S=2秒，-1表示无限制）
          time-between-eviction-runs: PT30S  # 空闲连接回收扫描间隔（3.x新增）
  ai:
    deepseek:
      base-url: "https://api.deepseek.com"
    chat:
      client:
        enabled: false
      memory:
        repository:
          jdbc:
            initialize-schema: always   #项目启动时自动初始化chat memory表

minio:
  endpoint: <> # MinIO服务地址（本地部署默认9000端口）
  access-key: <> # MinIO访问密钥（默认账号）
  secret-key: <> # MinIO秘钥（默认密码）
  bucket-name: <> # 存储图片的桶名（需提前在MinIO控制台创建，或让代码自动创建）
  read-path: <> # 图片访问的基础路径（与endpoint一致，若配置域名可改为域名）

